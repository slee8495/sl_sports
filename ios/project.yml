# XcodeGen 스펙. .xcodeproj 는 손으로 만들지 않는다 — pbxproj 는 사람이 고칠 물건이 아니고,
# 이 파일이 있으면 `xcodegen generate` 로 언제든 다시 만들 수 있어서 커밋할 필요도 없다.
#
# **파일을 새로 추가하면 `xcodegen generate` 를 먼저 돌린다.** 소스는 폴더째로 잡히므로,
# 안 돌리면 파일은 있는데 "cannot find 'X' in scope" 가 난다(브라우니에서 겪은 것).
name: SLSports
options:
  bundleIdPrefix: com.slstudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: DX4YLNP9RK
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    # 올릴 때마다 하나씩 올린다. 안 올리면 애플이 거절한다.
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"

targets:
  SLSports:
    type: application
    platform: iOS
    sources:
      - path: SLSports
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slstudio.slsports
        PRODUCT_NAME: SLSports
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: SL Sports
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        # 아이폰은 세로만, 아이패드는 네 방향 전부. 아이패드에서 한 방향이라도 빼면 애플이
        # 멀티태스킹(Split View)을 위해 네 방향을 요구해서 업로드가 거절된다.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # 아이폰 + 아이패드. 넓은 화면은 웹앱이 맡는다 — 본문이 max-w-4xl(896pt)로 가운데에
        # 서므로 아이패드 가로에서도 늘어지지 않는다(src/app/layout.tsx).
        TARGETED_DEVICE_FAMILY: "1,2"
        # 챗의 마이크 버튼이 웹뷰 안에서 녹음을 건다. 이 문구가 없으면 iOS 가 마이크를
        # 아예 안 열어 주고, 화면에는 아무 일도 안 일어난 것처럼 보인다.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "말로 팀에 대해 물어볼 때 씁니다."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
